{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Register - SmartShop</title>
    <link rel="stylesheet" href="{% static 'store/style.css' %}">
</head>

<body>

<nav>
    <h1>🛒 SmartShop</h1>

    <div class="nav-menu">

        <a href="{% url 'product_list' %}" class="home-btn">
            🏠 Home
        </a>

        <a href="{% url 'cart' %}" class="cart-btn">
            🛒 Cart
        </a>

        {% if user.is_authenticated %}

            <span class="welcome-user">
                👋 Welcome, {{ user.username }}
            </span>

            <a href="{% url 'logout' %}" class="logout-btn">
                🚪 Logout
            </a>

        {% else %}

            <a href="{% url 'login' %}" class="login-btn">
                🔐 Login
            </a>

            <a href="{% url 'register' %}" class="register-btn">
                📝 Register
            </a>

        {% endif %}

    </div>
</nav>

<div class="login-container">

    <div class="login-box">

        <h2>📝 Create Account</h2>

        <p>Join SmartShop today!</p>

        <form method="POST">

            {% csrf_token %}

            <label>Username</label>

            <input type="text"
                   name="username"
                   placeholder="Create a username"
                   required>

            <label>Password</label>

            <input type="password"
                   name="password"
                   placeholder="Create a password"
                   required>

            <button type="submit" class="login-submit">
                Register
            </button>

        </form>

        <p class="register-text">
            Already have an account?
            <a href="{% url 'login' %}">
                Login here
            </a>
        </p>

    </div>

</div>

</body>
</html>
